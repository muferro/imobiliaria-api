version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: imobiliaria_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: imobiliaria
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - imobiliaria_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: imobiliaria_api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/imobiliaria
      MONGODB_USER: admin
      MONGODB_PASSWORD: admin123
      CORS_ORIGIN: http://localhost:4200
      JWT_SECRET: dev_secret_key_change_in_production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - imobiliaria_network
    command: npm run dev

volumes:
  mongodb_data:
  mongodb_config:

networks:
  imobiliaria_network:
    driver: bridge
